# ============================================================================
# Production Profile Configuration
# ============================================================================

# Security - Strict in production
spring.security.debug=false

# Logging - Less verbose, no sensitive data
logging.level.root=WARN
logging.level.com.babyshop.api=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Server
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never

# CORS - Strict whitelist (configure via environment)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://babyshop.com.bd}

# Rate Limiting - Enabled
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=60

# SSL/TLS - Force HTTPS
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE_PATH}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# Actuator - Restricted access
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

