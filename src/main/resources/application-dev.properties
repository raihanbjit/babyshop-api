# ============================================================================
app.rate-limiting.enabled=false
# Rate Limiting - Disabled in dev

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
# CORS - Allow all origins in dev (NEVER in production)

server.error.include-exception=true
server.error.include-stacktrace=always
# Server

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.babyshop.api=DEBUG
# Logging - More verbose in dev

spring.security.debug=true
# Security - Relaxed for development

# ============================================================================
# Development Profile Configuration

